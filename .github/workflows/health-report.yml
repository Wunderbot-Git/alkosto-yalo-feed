name: Pipeline health report

# Triggered by cron-job.org at 07:15 and 13:15 Bogotá (12:15 / 18:15 UTC),
# ~20 min after each refresh cycle. Deliberately NOT on a GitHub schedule:
# scheduled runs start hours late, which would make the report as unreliable
# as the problem it watches for. Can also be run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_AGENT_KEY: ${{ secrets.ALGOLIA_AGENT_KEY }}
        run: python scripts/health_report.py

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Alkosto Feed Monitor <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.report.outputs.subject || '❌ Feed Alkosto→Algolia · el chequeo no pudo ejecutarse' }}
          body: file://report.txt
