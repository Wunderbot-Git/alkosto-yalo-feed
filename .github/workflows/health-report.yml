name: Pipeline health report

# Morning report, every day at 08:00 Bogotá, dispatched by cron-job.org (a
# GitHub schedule alone would start hours late). The 08:15 Bogotá cron below is
# only a backstop: the script skips the email if the 08:00 report already went out.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"   # 08:15 Bogotá backstop

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_AGENT_KEY: ${{ secrets.ALGOLIA_AGENT_KEY }}
        run: python scripts/health_report.py

      - name: Email report
        if: always() && steps.report.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Alkosto Feed Monitor <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.report.outputs.subject || '❌ Feed Alkosto→Algolia · el chequeo no pudo ejecutarse' }}
          body: file://report.txt
