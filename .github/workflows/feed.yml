name: Refresh Alkosto product feed

on:
  schedule:
    # Bogotá is UTC-5. 8:00 / 13:00 local => 13:00 / 18:00 UTC.
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Process products feed (laptops/desktops/tablets/monitors/printers/TVs)
        env:
          ALKOSTO_USERNAME: ${{ secrets.ALKOSTO_USERNAME }}
          ALKOSTO_PASSWORD: ${{ secrets.ALKOSTO_PASSWORD }}
        run: |
          python process_alkosto_products.py
          python replace_image_urls.py filtered_products.json

      - name: Generate computers + tablets subset
        run: |
          python filter_subset.py \
            --input filtered_products.json \
            --output filtered_computadores_tablets.json \
            --tipos laptop desktop tablet

      - name: Process celulares feed
        env:
          ALKOSTO_USERNAME: ${{ secrets.ALKOSTO_USERNAME }}
          ALKOSTO_PASSWORD: ${{ secrets.ALKOSTO_PASSWORD }}
        run: |
          python process_alkosto_celulares.py --skip-download
          python replace_image_urls.py filtered_celulares.json

      - name: Commit updated JSON if changed
        run: |
          git config user.name "alkosto-feed-bot"
          git config user.email "alkosto-feed-bot@users.noreply.github.com"
          git add filtered_products.json filtered_computadores_tablets.json filtered_celulares.json
          if git diff --cached --quiet; then
            echo "No changes in feed output."
          else
            git commit -m "feed: refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi

      - name: Count records in computers + tablets subset
        id: subset_count
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('filtered_computadores_tablets.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Email computers + tablets subset
        if: success() && env.MAIL_TO != ''
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Alkosto Yalo Feed <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: "Alkosto feed — Computadores y Tablets (${{ steps.subset_count.outputs.count }} productos)"
          body: |
            Catálogo actualizado de Computadores y Tablets de Alkosto.

            Tipos incluidos : laptop, desktop, tablet
            Total productos : ${{ steps.subset_count.outputs.count }}
            Fecha (UTC)     : ${{ github.event.repository.updated_at }}

            URL pública (raw):
            https://raw.githubusercontent.com/${{ github.repository }}/main/filtered_computadores_tablets.json

            Workflow run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: filtered_computadores_tablets.json
